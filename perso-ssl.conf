<VirtualHost *:443>
    # Domaine principal (Prod)
    ServerName ip87-106-3-165.pbiaas.com

    # Environnement de Dev
    ServerAlias 87.106.123.60

    # Chemin vers le dossier du site WordPress
    DocumentRoot /var/www/html/wordpress

    # Certificats SSL (Certbot remplacera ces lignes automatiquement en Prod)
    SSLEngine On
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    <Directory /var/www/html/wordpress>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    # Exclusions Proxy pour WordPress
    ProxyPass /wp-admin !
    ProxyPass /wp-content !
    ProxyPass /wp-includes !
    ProxyPass /wp-json !
    ProxyPass /wp-login.php !
    ProxyPass /wp-cron.php !
    ProxyPass /wp-comments-post.php !
    ProxyPass /xmlrpc.php !
    ProxyPass /index.php !

    # React / Next.js WebSockets (HMR)
    ProxyPass /_next/hmr ws://127.0.0.1:3000/_next/hmr
    ProxyPassReverse /_next/hmr ws://127.0.0.1:3000/_next/hmr

    # Proxy vers l'application React/Next.js
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # En-têtes CORS pour autoriser les appels API React <-> WooCommerce
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
    </IfModule>

    # Gestion des en-têtes HTTPS
    SetEnvIf X-Forwarded-Proto https HTTPS=on
</VirtualHost>
