<VirtualHost *:80>
    ServerName ip87-106-3-165.pbiaas.com
    ServerAlias 87.106.3.165 87.106.123.60

    DocumentRoot /var/www/html/wordpress

    <Directory /var/www/html/wordpress>
        AllowOverride All
        Options -Indexes
        Require all granted
    </Directory>

    # Redirection HTTP vers HTTPS !
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>
